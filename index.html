<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차량운행일지</title>
<style>
*{box-sizing:border-box;margin:0}
:root{--k:1}
body{font-family:-apple-system,"Pretendard","Malgun Gothic",sans-serif;background:#f4f2ee;color:#1f1f1f;padding:20px 16px 40px;max-width:480px;margin:auto}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;color:inherit}
.head{display:flex;justify-content:space-between;align-items:flex-start;margin:14px 0 18px}
h1{font-size:calc(28px * var(--k));font-weight:800;margin-top:18px}h1 span{color:#3b5bdb}
.right{display:flex;gap:8px;align-items:flex-start}
.pill{margin-top:12px;padding:10px 14px;background:#f1edff;border:1.5px solid #d9d0fa;color:#6d3bd8;font-weight:700;border-radius:30px;font-size:calc(14px * var(--k))}
.fabw{text-align:center;font-size:calc(12px * var(--k));color:#6d3bd8;font-weight:600}
.fab{width:50px;height:50px;border-radius:50%;background:#7239d8;font-size:calc(21px * var(--k));box-shadow:0 6px 14px #7239d84d;margin-bottom:3px}
.card{background:#fff;border:1.5px solid #e7e4de;border-radius:22px;padding:18px 20px;margin-bottom:14px}
.lbl{font-size:calc(13px * var(--k));color:#999}.date{font-size:calc(21px * var(--k));font-weight:800;margin-top:4px}
.dot{width:10px;height:10px;border-radius:50%;background:#a8e6bf}
.row{display:flex;justify-content:space-between;align-items:center}
.guide b{font-size:calc(17px * var(--k))}.guide p{color:#777;font-size:calc(14px * var(--k));line-height:1.6;margin-top:6px}
.p{color:#7239d8}.bl{color:#3b5bdb}
.sec{font-size:calc(14px * var(--k));font-weight:700;color:#aaa;margin:20px 4px 10px}
.empty{border:1.5px dashed #d8d5cf;border-radius:18px;padding:22px;text-align:center;color:#aaa;font-size:calc(15px * var(--k))}
.cars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.car{background:#fff;border:1.5px solid #e7e4de;border-radius:20px;padding:0 0 14px;text-align:center;overflow:hidden;box-shadow:0 4px 10px #0000000a}
.car .bar{height:5px}
.car .ic{width:62px;height:62px;border-radius:16px;margin:14px auto 8px;display:flex;align-items:center;justify-content:center}
.car .pl{font-size:calc(12px * var(--k));font-weight:700}.car .nm{font-size:calc(17px * var(--k));font-weight:800;margin-top:6px}
.fz{margin-top:8px;font-size:calc(11px * var(--k));line-height:1.3}
.car .st{font-size:calc(11px * var(--k));color:#c2410c;font-weight:700;margin-top:3px;min-height:14px}
.rcard{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #d9d0fa;border-radius:18px;padding:14px 16px;margin-bottom:10px}
.rcard b{font-size:calc(16px * var(--k))}.rcard small{display:block;color:#777;margin-top:4px;font-size:calc(13px * var(--k))}
.back{background:none;color:#3b5bdb;font-weight:700;padding:4px 0;font-size:calc(14px * var(--k))}
h2{font-size:calc(20px * var(--k));font-weight:800;margin:6px 0 4px}
label{display:block;font-weight:700;font-size:calc(14px * var(--k));margin:16px 0 6px}
input,select{width:100%;padding:13px;border:1.5px solid #dcd8d1;border-radius:14px;font:inherit;font-size:calc(16px * var(--k));background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;gap:8px}.opts button{flex:1;padding:13px;background:#f6f4f0;border:2px solid #e7e4de;font-weight:600}
.opts button.on{background:#e9edff;border-color:#3b5bdb;color:#3b5bdb;font-weight:800}
.main{width:100%;padding:16px;background:#3b5bdb;color:#fff;font-weight:800;font-size:calc(17px * var(--k));margin-top:18px}
.main.g{background:#2f9e5f}.main.pu{background:#7239d8}.main:disabled{background:#aaa}
.info{background:#f8f7f4;border-radius:14px;padding:12px 14px;font-size:calc(14px * var(--k));line-height:1.8;margin-top:10px}
.info b{color:#3b5bdb}
.opt{border-top:1.5px dashed #ddd;margin-top:18px;padding-top:2px}
.err{color:#dc2626;font-size:calc(13px * var(--k));margin-top:8px;min-height:16px}
.hide{display:none}
.fontbar{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
.fontbar button{padding:6px 10px;background:#fff;border:1.5px solid #e7e4de;font-weight:600;font-size:13px;color:#777}
.fontbar button.on{background:#e9edff;border-color:#3b5bdb;color:#3b5bdb;font-weight:800}
.big label{font-size:calc(24px * var(--k));margin:26px 0 10px}
.big h2{font-size:calc(26.67px * var(--k))}
.big .lbl{font-size:calc(18px * var(--k))}
.big .info{font-size:calc(clamp(16px,4.9vw,28px) * var(--kinfo, 1));line-height:1.8}
.big input{font-size:calc(26px * var(--k));padding:18px}
.big .two input{font-size:calc(clamp(15px,4.3vw,22px) * var(--k));padding:12px 8px}
.two>*{min-width:0}
.two input{width:100%;min-width:0}
.big .opts button{font-size:calc(26px * var(--k));padding:20px}
.big .main{font-size:calc(28px * var(--k));padding:22px}
.big .back{font-size:calc(22px * var(--k))}
.big .edit{font-size:calc(clamp(14px,3.8vw,20px) * var(--kinfo, 1));padding:6px 12px}
.big .err{font-size:calc(20px * var(--k))}
.big .req{font-size:calc(18px * var(--k));color:#dc2626}
.big .gz button{height:calc(64px * var(--k))}
.big .acch{font-size:calc(24px * var(--k));padding:14px}
#memo::placeholder{font-size:calc(20px * var(--k))}
.big .acc.open .accb{max-height:160px}
.big .sec{font-size:calc(24px * var(--k))}
#recBox{font-size:calc(clamp(15px,4.6vw,24px) * var(--k))}
.rec{background:#f8f7f4;border-radius:14px;padding:10px 12px;margin-top:8px;line-height:1.5}
.rec .l1{font-weight:700;color:#3b5bdb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .nw{white-space:nowrap}
.rec b{color:#1f1f1f}
.rec .l3 b{color:#3b5bdb}
.pp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pp button{height:calc(76px * var(--k));background:#fff;border:2px solid #e7e4de;font-size:calc(clamp(15px,4.4vw,28px) * var(--k));font-weight:800;color:#1f1f1f;white-space:nowrap;padding:0;min-width:0}
.pp button.on{background:#e9edff;border-color:#3b5bdb;color:#3b5bdb}
.gz{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.gz button{height:calc(46px * var(--k));padding:0;background:#ebe8e2;border-radius:6px}
.gz button.on{background:#2f9e5f}.gz button.ony{background:#f59e0b}.gz button.onr{background:#dc2626}
.acc{border:1.5px solid #e7e4de;border-radius:14px;margin-top:12px;overflow:hidden}
.acch{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px;background:#f8f7f4;font-weight:700;font-size:calc(15px * var(--k));border-radius:0}
.acch small{color:#999;font-weight:400}.acch i{font-style:normal;transition:transform .25s}
.acc.open .acch{background:#e9edff;color:#3b5bdb}.acc.open .acch i{transform:rotate(180deg)}
.accb{max-height:0;padding:0 12px;overflow:hidden;transition:max-height .25s ease,padding .25s ease}
.acc.open .accb{max-height:90px;padding:12px}
.edit{background:#e9edff;color:#3b5bdb;padding:3px 10px;font-size:calc(12px * var(--k));font-weight:700;border-radius:8px;margin-left:8px}
.x{background:#fee2e2;color:#b91c1c;padding:6px 10px;font-size:calc(12px * var(--k));font-weight:700;border-radius:10px}
.toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);background:#2f9e5f;color:#fff;padding:18px 28px;border-radius:16px;font-size:calc(18px * var(--k));font-weight:800;display:none;z-index:9;box-shadow:0 6px 20px #0004}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ===== 기관 연결: 앱 첫 화면에서 GAS 주소를 입력합니다 (코드 수정 불필요) ===== */
let GAS_URL = "";
// 차량·운전자 목록은 구글시트의 "차량", "운전자" 탭에서 불러옵니다 (코드 수정 불필요)
const PALETTE = [{c:"#3b5bdb",bg:"#eaeefd"},{c:"#3d8361",bg:"#e8f3ee"},{c:"#b5622e",bg:"#faeee4"},{c:"#7239d8",bg:"#f1edff"},{c:"#d6336c",bg:"#fdeaf1"},{c:"#0c8599",bg:"#e3f6f9"}];
let DRIVERS = [], CARS = [];
function applyCfg(cars,drivers){ CARS=cars.map((x,i)=>({...x,...PALETTE[i%PALETTE.length]})); DRIVERS=drivers; }
/* ================================== */

const $ = s => document.querySelector(s);
const ls = {get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}, set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const pad = n => String(n).padStart(2,"0");
const dStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const tStr = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const trips = () => ls.get("trips",{});
const info = n => CARS.find(c=>c.n===n);
let driver = ls.get("driver",null), car=null, view="home", pre=null, resv=null, purpose="업무", rPurpose="업무", fuelOn=false, fixOn=false, gauge="";
let fuelMap = ls.get("fuelMap",{}), recent = ls.get("recent",{}), recentReady = false, people = 1;
const GAUGE_N = 10; // 연료 게이지 칸 수
{ const c=ls.get("cfg",null);
  applyCfg(c?c.cars:[], c?c.drivers:[]); }
let cfgReady = !!ls.get("cfg",null), cfgFail = false;
// 저장된 게이지 값(예: "7/10칸", 예전 기록 "6/12칸")을 10칸 기준 칸 수로 바꿉니다
function gaugeLvl(g){
  const m=(g||"").match(/^(\d+)\/(\d+)/);
  if(m) return Math.min(GAUGE_N, Math.round(+m[1]*GAUGE_N/+m[2]));
  return ({"가득":GAUGE_N,"3/4":8,"1/2":5,"1/4":3,"거의 없음":1})[g]||0;
}
function fuelSvg(n){
  const g=fuelMap[n], k=gaugeLvl(g);
  if(!k) return `<span style="color:#bbb">주유량 기록 없음</span>`;
  const col=k>=6?"#2f9e5f":k>=3?"#f59e0b":"#dc2626";
  let cells=""; for(let i=0;i<GAUGE_N;i++) cells+=`<rect x="${i*7}" y="2" width="6" height="22" rx="1.5" fill="${i<k?col:'#ebe8e2'}"/>`;
  return `<svg width="72" height="36" viewBox="0 0 72 36">${cells}<text x="0" y="34" font-size="9" fill="#aaa">E</text><text x="62" y="34" font-size="9" fill="#aaa">F</text></svg>`;
}
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
// 선택 차량의 직전 도착 계기판 (최신 기록 1건)
function lastRec(c){ return (recent[c]||[]).find(r=>r.odoE)||null; }

function svgCar(c){return `<svg width="46" height="28" viewBox="0 0 64 36"><path d="M5 25 L10 14 Q13 8 20 8 H42 Q49 8 53 15 L59 22 Q61 25 58 27 H5Z" fill="${c}"/><rect x="17" y="12" width="12" height="7" rx="2" fill="#fff" opacity=".6"/><rect x="32" y="12" width="12" height="7" rx="2" fill="#fff" opacity=".6"/><circle cx="19" cy="28" r="5" fill="#222"/><circle cx="46" cy="28" r="5" fill="#222"/><circle cx="19" cy="28" r="2" fill="#fff"/><circle cx="46" cy="28" r="2" fill="#fff"/></svg>`}

// k: 출발·도착 화면 배율, g: 첫 화면 버튼의 '가' 글자 크기 (작게 → 크게), 기기에 저장
const FONT_STEPS=[{k:0.8,g:18},{k:1.2,g:24}];  // 0: 중간(기본), 1: 크게
let fontStep = Math.min(1, ls.get("fontStep",0));
// 선택한 배율을 화면 전체에 적용 (첫 화면 포함)
function applyFont(){ document.documentElement.style.setProperty("--k", FONT_STEPS[fontStep].k); }
// 출발·도착 화면: 크게를 골라도 나머지 글씨는 중간 배율, 운전자·출발·출발계기판 줄(--kinfo)만 선택한 배율 유지
function kv(){
  const sel=FONT_STEPS[fontStep].k, rest = fontStep===1 ? FONT_STEPS[0].k : sel;
  return `--k:${rest};--kinfo:${sel}`;
}
function setFont(i){ fontStep=i; ls.set("fontStep",i); applyFont(); if(view==="home" && !car) home(); }

function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",1400)}

async function loadResv(){
  if(!GAS_URL) return;
  try{
    const r = await fetch(GAS_URL+"?action=list"); const j = await r.json();
    resv = j.ok ? j.list : [];
    if(j.ok && j.fuel){ fuelMap=j.fuel; ls.set("fuelMap",fuelMap); }
    if(j.ok && j.recent){ recent=j.recent; ls.set("recent",recent); recentReady=true; }
    const rec=lastRec(car), o=$("#odoS");
    if(o && o.dataset.auto==="1" && rec) o.value=rec.odoE;
    if($("#recBox")) refreshRecent();
    if(j.ok && j.cars && j.drivers){
      applyCfg(j.cars,j.drivers); ls.set("cfg",{cars:j.cars,drivers:j.drivers}); cfgReady=true; cfgFail=false;
      if(driver && !DRIVERS.includes(driver)){ driver=null; localStorage.removeItem("driver"); car=null; view="home"; }
    }
  }catch(e){ resv = []; cfgFail=true; }
  if(view==="connect") return;
  if(!driver) pickDriver(); else if(view==="home" && !car) home();
  if(view==="reserve") reserveView();
}

function render(){
  if(!GAS_URL) return connectView();
  if(view==="connect") return connectView();
  if(!driver) return pickDriver();
  if(view==="reserve") return reserveView();
  if(!car) return home();
  trips()[car] ? arrive() : depart();
}
function goHome(){ car=null; view="home"; pre=null; render(); }

/* ---------- 운전자 ---------- */
function pickDriver(){
  $("#app").innerHTML = `<div class="head"><h1>차량<span>운행</span>일지</h1></div>
  <div class="card"><b style="font-size:calc(17px * var(--k))">운전자를 선택하세요</b><p class="lbl" style="margin-top:6px">한 번 선택하면 이 기기에 저장됩니다.</p>
  ${driverBox()}</div>${FOOT}`;
}
function driverBox(){
  if(DRIVERS.length) return `<div class="opts" style="flex-wrap:wrap;margin-top:12px">${DRIVERS.map(n=>`<button style="flex:1 1 45%" onclick="setDriver('${n}')">👤 ${n}</button>`).join("")}</div>`;
  if(cfgFail && !cfgReady) return `<div class="empty" style="margin-top:12px">목록을 불러오지 못했습니다.<br>인터넷 연결과 GAS 주소를 확인해 주세요.</div>`;
  if(!cfgReady) return `<div class="empty" style="margin-top:12px">불러오는 중...</div>`;
  return `<div class="empty" style="margin-top:12px">시트에서 이름을 설정해 주세요.</div>`;
}
function setDriver(n){ driver=n; ls.set("driver",n); goHome(); }
function changeDriver(){ driver=null; render(); }

/* ---------- 메인 ---------- */
function home(){
  const now=new Date(), days=["일","월","화","수","목","금","토"], t=trips(), today=dStr(now);
  const mine = (resv||[]).filter(r=>r.date===today);
  const list = resv===null ? `<div class="empty">불러오는 중...</div>`
    : mine.length ? mine.map(r=>`<button class="rcard" onclick="useResv('${r.id}')"><b>${r.start}~${r.end} · ${r.car}</b><small>${r.driver} · ${r.dest} · ${r.purpose}</small></button>`).join("")
    : `<div class="empty">오늘 예약이 없습니다</div>`;
  $("#app").innerHTML = `
  <div class="fontbar">${FONT_STEPS.map((s,i)=>`<button class="${i===fontStep?'on':''}" style="font-size:${s.g}px" aria-label="글씨 ${['중간','크게'][i]}" onclick="setFont(${i})">가</button>`).join("")}</div>
  <div class="head"><h1>차량<span>운행</span>일지</h1>
    <div class="right"><button class="pill" onclick="changeDriver()">👤 ${driver}</button>
    <div class="fabw"><button class="fab" onclick="openReserve()">📅</button>예약</div></div></div>
  <div class="card row"><div><div class="lbl">오늘</div><div class="date">${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${days[now.getDay()]}요일)</div></div><div class="dot"></div></div>
  <div class="card guide"><b>오늘 예약이 있다면 <span class="p">카드를 탭</span>해주세요</b><p>예약이 없거나 직접 기록할 경우<br><span class="bl"><b style="font-size:calc(14px * var(--k))">아래 차량 버튼</b></span>을 탭하면 바로 이동합니다</p></div>
  <div class="sec">오늘 예약</div>${list}
  <div class="sec">차량 선택</div>
  ${CARS.length||!cfgReady?"":`<div class="empty">시트의 "차량" 탭에 차량을 등록해 주세요.</div>`}<div class="cars">${CARS.map(c=>`<button class="car" onclick="pickCar('${c.n}')"><div class="bar" style="background:${c.c}"></div>
    <div class="ic" style="background:${c.bg}">${svgCar(c.c)}</div><div class="pl" style="color:${c.c}">${c.p}</div><div class="nm">${c.n}</div>
    <div class="fz">${fuelSvg(c.n)}</div><div class="st">${t[c.n]?'운행 중':''}</div></button>`).join("")}</div>
  ${FOOT}`;
}
function pickCar(v){ car=v; view="trip"; render(); loadResv(); }
function useResv(id){
  const r=resv.find(x=>x.id===id); if(!r) return;
  pre={id:r.id, dest:r.dest, purpose:r.purpose}; pickCar(r.car);
}

/* ---------- 예약 ---------- */
function openReserve(){ view="reserve"; rPurpose="업무"; reserveView(); loadResv(); }
function reserveView(){
  const today=dStr(new Date());
  const keep = {d:$("#rDate")?.value||today, c:$("#rCar")?.value, s:$("#rS")?.value||"09:00", e:$("#rE")?.value||"18:00", t:$("#rDest")?.value||""};
  const list = resv===null ? `<div class="empty">불러오는 중...</div>`
    : resv.length ? resv.map(r=>`<div class="card row" style="padding:14px 16px;margin-bottom:10px"><div><b>${r.date.slice(5).replace("-","/")} ${r.start}~${r.end} · ${r.car}</b><div class="lbl" style="margin-top:4px">${r.driver} · ${r.dest} · ${r.purpose}</div></div>
      ${r.driver===driver?`<button class="x" onclick="cancelResv('${r.id}')">취소</button>`:''}</div>`).join("")
    : `<div class="empty">예정된 예약이 없습니다</div>`;
  $("#app").innerHTML = `<button class="back" onclick="goHome()">← 처음으로</button>
  <h2>차량 예약</h2><div class="lbl">예약자: ${driver}</div>
  <div class="card" style="margin-top:12px">
  <label style="margin-top:0">날짜</label><input type="date" id="rDate" min="${today}" value="${keep.d}">
  <label>차량</label><select id="rCar">${CARS.map(c=>`<option ${c.n===keep.c?'selected':''}>${c.n}</option>`).join("")}</select>
  <div class="two"><div><label>출발 시간</label><input type="time" id="rS" value="${keep.s}"></div><div><label>반납 시간</label><input type="time" id="rE" value="${keep.e}"></div></div>
  <label>목적지</label><input type="text" id="rDest" placeholder="예: 춘천시청" value="${keep.t}">
  <label>이용목적</label><div class="opts"><button id="rp1" class="${rPurpose==='업무'?'on':''}" onclick="setRP('업무')">업무</button><button id="rp2" class="${rPurpose==='통역'?'on':''}" onclick="setRP('통역')">통역</button></div>
  <div class="err" id="err"></div><button class="main pu" id="rBtn" onclick="doReserve()">예약하기</button></div>
  <div class="sec">예약 현황</div>${list}`;
}
function setRP(p){ rPurpose=p; $("#rp1").classList.toggle("on",p==="업무"); $("#rp2").classList.toggle("on",p==="통역"); }
async function doReserve(){
  const err=$("#err"), btn=$("#rBtn");
  const d={action:"reserve", date:$("#rDate").value, car:$("#rCar").value, start:$("#rS").value, end:$("#rE").value, dest:$("#rDest").value.trim(), purpose:rPurpose, driver};
  if(!d.date||!d.start||!d.end) return err.textContent="날짜와 시간을 입력해 주세요.";
  if(d.end<=d.start) return err.textContent="반납 시간은 출발 시간보다 늦어야 합니다.";
  if(!d.dest) return err.textContent="목적지를 입력해 주세요.";
  const clash=(resv||[]).find(r=>r.car===d.car&&r.date===d.date&&d.start<r.end&&d.end>r.start);
  if(clash) return err.textContent=`이미 예약됨: ${clash.start}~${clash.end} (${clash.driver})`;
  err.textContent=""; btn.disabled=true; btn.textContent="예약 중...";
  try{
    const j = await (await fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d)})).json();
    if(!j.ok) throw new Error(j.error);
    toast("예약되었습니다"); $("#rDest").value=""; await loadResv();
  }catch(x){ err.textContent=String(x.message||"예약에 실패했습니다.").slice(0,60); btn.disabled=false; btn.textContent="예약하기"; }
}
async function cancelResv(id){
  if(!confirm("이 예약을 취소할까요?")) return;
  try{ await fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"cancel",id})}); toast("취소되었습니다"); loadResv(); }
  catch(e){ alert("취소에 실패했습니다."); }
}

/* ---------- 출발 ---------- */
const fmtKm = s => s ? (+s).toLocaleString() : "-";
// 선택 차량의 최근 운행기록 3건 HTML
function recentHtml(c){
  const l=recent[c]||[];
  if(!l.length) return `<div class="empty" style="padding:14px">${recentReady?"운행 기록이 없습니다":"기록을 불러오는 중..."}</div>`;
  // 3줄: 날짜·시간 / 운전자·행선지 / 계기판. 행선지는 10자 이하면 줄바꿈 없이, 10자를 넘으면 다음 줄로 넘김
  return l.map(r=>{
    const shortDest = (r.dest||"").length <= 10;
    return `<div class="rec"><div class="l1">${esc(r.md)} ${esc(r.st)}~${esc(r.en)}</div>`+
      `<div class="l2"><span class="nw"><b>${esc(r.driver)}</b></span> · <span class="${shortDest?'nw':''}">${esc(r.dest)}</span></div>`+
      `<div class="l3">계기판 ${fmtKm(r.odoS)} → <b>${fmtKm(r.odoE)} km</b></div></div>`;
  }).join("");
}
// 기록이 새로 도착하면 기록 목록과 출발 계기판 기본값을 갱신
function refreshRecent(){
  const b=$("#recBox"); if(b) b.innerHTML=recentHtml(car);
  const o=$("#odoS"), rec=lastRec(car);
  if(o && o.dataset.auto==="1" && rec) o.value=rec.odoE;
}
function depart(){
  const rec=lastRec(car), last = rec ? rec.odoE : "", c=info(car);
  $("#app").innerHTML = `<div class="big" style="${kv()}"><button class="back" onclick="goHome()">← 차량 선택</button>
  <div class="card" style="border-top:5px solid ${c.c}"><h2>${car} · 출발</h2><div class="lbl">${c.p} · 운전자 ${driver}</div>
  ${pre?`<div class="info">📅 예약: <b>${pre.dest}</b> (${pre.purpose})</div>`:''}
  <label>출발 계기판 (km)</label><input type="number" id="odoS" inputmode="numeric" placeholder="예: 52340" value="${last}" data-auto="1" oninput="this.dataset.auto=''">
  <div style="color:#dc2626;font-size:calc(18px * var(--k));margin-top:8px">자동 입력된 숫자가 계기판과 다르면 직접 입력해 주세요.</div>
  <div class="lbl" style="margin-top:6px">출발 날짜·시간은 버튼을 누르면 자동 기록됩니다.</div>
  <div class="err" id="err"></div><button class="main" onclick="doDepart()">🚀 출발</button>
  <div class="sec" style="margin:24px 0 0">직전 운행기록</div>
  <div id="recBox">${recentHtml(car)}</div></div></div>`;
}
function doDepart(){
  const o=+$("#odoS").value;
  if(!o||o<=0) return $("#err").textContent="출발 계기판 숫자를 입력해 주세요.";
  const n=new Date(), t=trips();
  t[car]={driver, odoS:o, date:dStr(n), time:tStr(n), dest:pre?pre.dest:"", purpose:pre?pre.purpose:"업무", resId:pre?pre.id:""};
  ls.set("trips",t); pre=null; render();
}

/* ---------- 도착 ---------- */
function arrive(){
  const tr=trips()[car], c=info(car); purpose=tr.purpose||"업무"; gauge=""; people=1;
  $("#app").innerHTML = `<div class="big" style="${kv()}"><button class="back" onclick="goHome()">← 차량 선택</button>
  <div class="card" style="border-top:5px solid ${c.c}"><h2>${car} · 도착</h2>
  <div class="info">운전자: <b>${tr.driver}</b><br><span style="white-space:nowrap">출발: <b id="sTxt">${tr.date} ${tr.time}</b> <button class="edit" onclick="editStart()">수정</button></span><br>출발 계기판: <b>${tr.odoS.toLocaleString()} km</b></div>
  <div id="sEdit" class="hide" style="margin-top:8px"><div class="lbl">출발 날짜·시간 수정</div>
  <div class="two" style="margin-top:6px"><input type="date" id="sD" value="${tr.date}" oninput="updStart()"><input type="time" id="sT" value="${tr.time}" oninput="updStart()"></div></div>
  <label>도착 계기판 (km) <span class="req">*필수</span></label>
  <div class="lbl">출발: ${tr.odoS.toLocaleString()} km → 이 숫자보다 커야 합니다</div>
  <div style="display:flex;align-items:center;gap:12px">
  <input type="number" id="odoE" inputmode="numeric" oninput="calc()" style="width:50%">
  <div id="dist" style="flex:1;min-height:44px"></div></div>
  <label>탑승인원</label>
  <div class="pp">${[1,2,3,4,5,6].map(n=>`<button id="pp${n}" class="${n===1?'on':''}" onclick="setPP(${n})">${n<6?n:'기타'}</button>`).join("")}</div>
  <div id="ppEtc" style="display:none;align-items:center;justify-content:center;gap:16px;margin-top:10px">
  <button onclick="ppStep(-1)" aria-label="한 명 줄이기" style="width:70px;height:calc(70px * var(--k));background:#f6f4f0;border:2px solid #dcd8d1;font-size:calc(26px * var(--k));font-weight:800">▼</button>
  <div style="min-width:90px;text-align:center;font-size:calc(36px * var(--k));font-weight:800"><span id="ppNum">6</span>명</div>
  <button onclick="ppStep(1)" aria-label="한 명 늘리기" style="width:70px;height:calc(70px * var(--k));background:#e9edff;border:2px solid #3b5bdb;color:#3b5bdb;font-size:calc(26px * var(--k));font-weight:800">▲</button></div>
  <label>행선지 <span class="req">*필수</span></label>
  <input type="text" id="dest" placeholder="어디를 다녀왔나요?" value="${tr.dest||''}">
  <label>목적 <span class="req">*필수</span></label>
  <div class="opts"><button id="p1" class="${purpose==='업무'?'on':''}" onclick="setP('업무')">업무</button><button id="p2" class="${purpose==='통역'?'on':''}" onclick="setP('통역')">통역</button></div>
  <label>🕒 도착 날짜·시간</label>
  <div class="two"><input type="date" id="eD" value="${dStr(new Date())}" oninput="this.dataset.t='1'"><input type="time" id="eT" value="${tStr(new Date())}" oninput="this.dataset.t='1'"></div>
  <div class="lbl" style="margin-top:6px">수정하지 않으면 저장하는 시각이 자동 기록됩니다.</div>
  <label>⛽ 잔유량 <span class="lbl">(선택)</span></label>
  <div class="gz">${Array.from({length:GAUGE_N},(_,i)=>`<button id="g${i}" onclick="setG(${i+1})"></button>`).join("")}</div><div class="lbl" id="gTxt" style="margin-top:6px">막대를 눌러 선택하세요 (왼쪽 E 비어 있음 ~ 오른쪽 F 가득)</div>
  <div class="acc"><button class="acch" id="mh" onclick="toggleMemo()"><span>🔧 차량정비 및 주유 <small>(선택)</small></span><i>▾</i></button>
  <div class="accb"><input type="text" id="memo" placeholder="예: 엔진오일 교환, 휘발유 40L 60,000원"></div></div>
  <div class="err" id="err"></div><button class="main g" id="saveBtn" onclick="save()">💾 저장</button></div></div>`;
}
// 1~5명은 버튼, '기타'를 누르면 6명부터 ▲▼로 한 명씩 조절
function setPP(n){
  const e=$("#ppEtc");
  if(n===6){ people=Math.max(6, people>=6?people:6); e.style.display="flex"; $("#ppNum").textContent=people; }
  else { people=n; e.style.display="none"; }
  for(let i=1;i<=6;i++) $("#pp"+i).classList.toggle("on", i===n);
}
function ppStep(d){ people=Math.max(6,(people||6)+d); $("#ppNum").textContent=people; }
function toggleMemo(){ const a=$("#mh").parentElement; a.classList.toggle("open"); if(a.classList.contains("open")) setTimeout(()=>$("#memo").focus(),280); }
function editStart(){ $("#sEdit").classList.toggle("hide"); }
function updStart(){ $("#sTxt").textContent = $("#sD").value+" "+$("#sT").value; }
function setP(p){ purpose=p; $("#p1").classList.toggle("on",p==="업무"); $("#p2").classList.toggle("on",p==="통역"); }
function setG(k){
  gauge = gauge===k+"/"+GAUGE_N+"칸" ? "" : k+"/"+GAUGE_N+"칸";
  const kk = gauge?k:0, cls = k>=6?"on":k>=3?"ony":"onr";
  for(let i=0;i<GAUGE_N;i++) $("#g"+i).className = i<kk?cls:"";
}
function calc(){ const tr=trips()[car], e=+$("#odoE").value; $("#dist").innerHTML = e>tr.odoS ? `<span style="font-size:calc(18px * var(--k));color:#999">운행거리</span><div style="font-size:calc(30px * var(--k));font-weight:800;color:#3b5bdb">${e-tr.odoS} km</div>` : ""; }

async function save(){
  const tr=trips()[car], err=$("#err"), btn=$("#saveBtn");
  const dest=$("#dest").value.trim(), ppl=people, e=+$("#odoE").value;
  if(!dest) return err.textContent="행선지를 입력해 주세요.";
  if(!ppl||ppl<1) return err.textContent="탑승인원을 입력해 주세요.";
  if(!e||e<=tr.odoS) return err.textContent=`도착 계기판은 ${tr.odoS}보다 큰 숫자여야 합니다.`;
  const sD=$("#sD").value, sT=$("#sT").value;
  if(!sD||!sT) return err.textContent="출발 날짜와 시간을 입력해 주세요.";
  let eD=$("#eD").value, eT=$("#eT").value;
  if($("#eD").dataset.t!=="1" && $("#eT").dataset.t!=="1"){ const nw=new Date(); eD=dStr(nw); eT=tStr(nw); }
  if(!eD||!eT) return err.textContent="도착 날짜와 시간을 입력해 주세요.";
  if(eD+" "+eT <= sD+" "+sT) return err.textContent="도착 시간은 출발 시간보다 늦어야 합니다.";
  err.textContent=""; btn.disabled=true; btn.textContent="저장 중...";
  const n=new Date();
  const data={action:"log", savedAt:`${dStr(n)} ${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`,
    driver:tr.driver, car, dest, people:ppl, purpose, startDate:sD, startTime:sT, endTime:eT,
    odoStart:tr.odoS, odoEnd:e, distance:e-tr.odoS, fuel:"", fix:$("#memo").value.trim(), gauge, resId:tr.resId||""};
  try{
    const j=await (await fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)})).json();
    if(!j.ok) throw new Error(j.error||"fail");
    const t=trips(); delete t[car]; ls.set("trips",t);
    // 방금 저장한 기록을 기기 안의 최근 기록 맨 앞에 넣어 둡니다 (다음 출발 때 바로 반영)
    recent[car]=[{md:sD.slice(5).replace("-","/"), st:tr.time, en:eT, driver:tr.driver, dest, odoS:String(tr.odoS), odoE:String(e)}];
    ls.set("recent",recent);
    if(gauge){ fuelMap[car]=gauge; ls.set("fuelMap",fuelMap); }
    if(tr.resId && resv) resv=resv.filter(r=>r.id!==tr.resId);
    toast("저장되었습니다"); setTimeout(goHome,1400);
  }catch(x){ err.textContent="저장에 실패했습니다. 인터넷 연결과 GAS 주소를 확인하고 다시 눌러 주세요."; btn.disabled=false; btn.textContent="💾 저장"; }
}

/* ---------- 기관 연결 ---------- */
const FOOT = `<div style="text-align:center;margin-top:26px"><button class="back" style="color:#aaa" onclick="openConnect()">⚙ 기관 연결 설정</button></div>`;
function clearCaches(){
  Object.keys(localStorage).forEach(k=>{ if(["cfg","fuelMap","recent","driver","trips"].includes(k)) localStorage.removeItem(k); });
  driver=null; car=null; resv=null; fuelMap={}; recent={}; recentReady=false; applyCfg([],[]); cfgReady=false; cfgFail=false;
}
function setGas(u){ if(u!==ls.get("gas","")) clearCaches(); ls.set("gas",u); GAS_URL=u; }
function openConnect(){ view="connect"; render(); }
function shareLink(){ return location.href.split("?")[0].split("#")[0]+"?gas="+encodeURIComponent(GAS_URL); }
function connectView(){
  const has=!!GAS_URL;
  $("#app").innerHTML = `${has?'<button class="back" onclick="goHome()">← 돌아가기</button>':''}
  <div class="head"><h1>기관<span>연결</span></h1></div>
  <div class="card"><b style="font-size:calc(17px * var(--k))">구글시트 연결 주소 입력</b>
  <p class="lbl" style="margin-top:6px;line-height:1.6">기관별로 만든 Apps Script 웹 앱 URL을 한 번만 입력하면 이 기기에 저장됩니다.</p>
  <input type="text" id="gasIn" placeholder="https://script.google.com/macros/s/.../exec" value="${GAS_URL}" style="margin-top:12px;font-size:calc(14px * var(--k))">
  <div class="err" id="err"></div><button class="main" id="gasBtn" onclick="connect()">연결하기</button></div>
  ${has?`<div class="card"><b style="font-size:calc(17px * var(--k))">직원용 접속 링크</b>
  <p class="lbl" style="margin-top:6px;line-height:1.6">이 링크로 접속하면 주소 입력 없이 바로 연결됩니다. 직원들에게 공유하세요.</p>
  <button class="main pu" onclick="copyLink()">🔗 링크 복사</button></div>`:''}`;
}
async function connect(){
  const u=$("#gasIn").value.trim(), err=$("#err"), btn=$("#gasBtn");
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) return err.textContent="주소가 올바르지 않습니다. https://script.google.com/.../exec 형태여야 합니다.";
  err.textContent=""; btn.disabled=true; btn.textContent="연결 확인 중...";
  try{
    const j=await (await fetch(u+"?action=list")).json();
    if(!j.ok) throw new Error("x");
    setGas(u); view="home"; car=null; render(); loadResv();
  }catch(e){ err.textContent="연결에 실패했습니다. 웹 앱 배포(액세스: 모든 사용자)와 주소를 확인해 주세요."; btn.disabled=false; btn.textContent="연결하기"; }
}
async function copyLink(){
  const l=shareLink();
  try{ await navigator.clipboard.writeText(l); toast("링크가 복사되었습니다"); }catch(e){ prompt("아래 링크를 복사하세요",l); }
}

{ const q=new URLSearchParams(location.search).get("gas");
  if(q && /^https:\/\/script\.google\.com\/.+\/exec$/.test(q)){ setGas(q); history.replaceState(null,"",location.pathname); }
  else GAS_URL=ls.get("gas",""); }
applyFont();
render(); loadResv();
</script>
</body>
</html>
